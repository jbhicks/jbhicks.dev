<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>About — jbhicks.dev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/static/tailwind.css" rel="stylesheet" type="text/css" />
    <link href="/static/daisyui.min.css" rel="stylesheet" type="text/css" />
    <script src="/static/htmx.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

    <style>
      :root {
        --bg-gradient-from: #f1f5f9;
        --bg-gradient-via: #e2e8f0;
        --bg-gradient-to: #cbd5e1;
        --text-primary: #1e293b;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-1: #10b981;
        --card-bg: rgba(255, 255, 255, 0.8);
        --card-border: #cbd5e1;
        --toggle-bg: rgba(255, 255, 255, 0.8);
        --toggle-border: #cbd5e1;
      }

      [data-theme="dark"] {
        --bg-gradient-from: #111827;
        --bg-gradient-via: #1f2937;
        --bg-gradient-to: #374151;
        --text-primary: #f9fafb;
        --text-secondary: #e5e7eb;
        --text-muted: #9ca3af;
        --accent-1: #a855f7;
        --card-bg: rgba(17, 24, 39, 0.8);
        --card-border: #374151;
        --toggle-bg: rgba(31, 41, 55, 0.8);
        --toggle-border: #4b5563;
      }

      body {
        background: linear-gradient(to bottom right, var(--bg-gradient-from), var(--bg-gradient-via), var(--bg-gradient-to));
        min-height: 100vh;
      }

      .theme-text-primary { color: var(--text-primary); }
      .theme-text-secondary { color: var(--text-secondary); }
      .theme-text-muted { color: var(--text-muted); }
      .theme-toggle-bg { background-color: var(--toggle-bg); }
      .theme-toggle-border { border-color: var(--toggle-border); }
    </style>
  </head>

  <body class="relative overflow-x-hidden transition-all duration-700">
    <button id="theme-toggle" class="fixed top-4 right-4 z-50 p-3 rounded-full backdrop-blur-sm border shadow-lg transition-all duration-300 hover:scale-110 hover:shadow-xl theme-toggle-bg theme-toggle-border">
      <svg id="sun-icon" class="w-5 h-5 text-amber-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <svg id="moon-icon" class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 24.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>

    <script>
      const themeToggle = document.getElementById('theme-toggle');
      const sunIcon = document.getElementById('sun-icon');
      const moonIcon = document.getElementById('moon-icon');
      const savedTheme = localStorage.getItem('theme') || 'dark';

      function updateThemeIcon(isDark) {
        if (isDark) {
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
        } else {
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
        }
      }

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        updateThemeIcon(theme === 'dark');
        localStorage.setItem('theme', theme);
      }

      setTheme(savedTheme);

      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });
    </script>

    <div
      hx-get="/templates/nav-bar.html"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></div>

    <div class="container mx-auto px-4 py-8 relative z-10 max-w-2xl">
      <div class="rounded-box bg-base-200 p-6 md:p-8">
        <h1 class="text-3xl font-bold mb-1 transition-colors duration-700 theme-text-primary">Joshua Hicks</h1>
        <p class="mb-4 transition-colors duration-700 theme-text-secondary">Phoenix, AZ. Go engineer.</p>
        <p class="mb-6 transition-colors duration-700 theme-text-secondary">Army veteran. Lead Software Engineer at American Veterans Rebuilding.</p>

        <h2 class="text-xl font-bold mb-3">Production</h2>
        <ul class="list-disc list-inside space-y-2 mb-6">
          <li>
            <a class="link" href="https://avrnpo.org">avrnpo.org</a>
            — veterans nonprofit site
          </li>
          <li>
            <a class="link" href="https://github.com/jbhicks/sound-cistern">sound-cistern</a>
            — SoundCloud feed filter
          </li>
          <li>
            <a class="link" href="https://github.com/jbhicks/media-manager">media-manager</a>
            — desktop app
          </li>
        </ul>

        <p>
          GitHub:
          <a class="link" href="https://github.com/jbhicks">https://github.com/jbhicks</a>
        </p>
      </div>
    </div>
  </body>
</html>
