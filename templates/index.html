<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>jbhicks.dev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/static/tailwind.css" rel="stylesheet" type="text/css" />
    <link href="/static/daisyui.min.css" rel="stylesheet" type="text/css" />
    <script src="/static/htmx.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    
    <style>
      :root {
        --bg-gradient-from: #f1f5f9;
        --bg-gradient-via: #e2e8f0;
        --bg-gradient-to: #cbd5e1;
        --text-primary: #1e293b;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-1: #10b981;
        --accent-2: #06b6d4;
        --accent-3: #f59e0b;
        --pin-color-1: #ef4444;
        --pin-color-2: #dc2626;
        --pulse-color: #ef4444;
        --grid-opacity: 0.03;
        --road-opacity: 0.04;
        --orb-1: rgba(16, 185, 129, 0.2);
        --orb-2: rgba(6, 182, 212, 0.2);
        --orb-3: rgba(245, 158, 11, 0.15);
        --card-bg: rgba(255, 255, 255, 0.8);
        --card-border: #cbd5e1;
        --toggle-bg: rgba(255, 255, 255, 0.8);
        --toggle-border: #cbd5e1;
      }
      
      [data-theme="dark"] {
        --bg-gradient-from: #111827;
        --bg-gradient-via: #1f2937;
        --bg-gradient-to: #374151;
        --text-primary: #f9fafb;
        --text-secondary: #e5e7eb;
        --text-muted: #9ca3af;
        --accent-1: #a855f7;
        --accent-2: #3b82f6;
        --accent-3: #6366f1;
        --pin-color-1: #f97316;
        --pin-color-2: #ea580c;
        --pulse-color: #f97316;
        --grid-opacity: 0.08;
        --road-opacity: 0.06;
        --orb-1: rgba(168, 85, 247, 0.2);
        --orb-2: rgba(59, 130, 246, 0.2);
        --orb-3: rgba(99, 102, 241, 0.2);
        --card-bg: rgba(17, 24, 39, 0.8);
        --card-border: #374151;
        --toggle-bg: rgba(31, 41, 55, 0.8);
        --toggle-border: #4b5563;
      }
      
      body {
        background: linear-gradient(to bottom right, var(--bg-gradient-from), var(--bg-gradient-via), var(--bg-gradient-to));
        min-height: 100vh;
      }
      
      .theme-text-primary { color: var(--text-primary); }
      .theme-text-secondary { color: var(--text-secondary); }
      .theme-text-muted { color: var(--text-muted); }
      .theme-accent-1 { color: var(--accent-1); }
      .theme-card-bg { background-color: var(--card-bg); }
      .theme-card-border { border-color: var(--card-border); }
      .theme-toggle-bg { background-color: var(--toggle-bg); }
      .theme-toggle-border { border-color: var(--toggle-border); }
      
      .orb-1 { background-color: var(--orb-1); }
      .orb-2 { background-color: var(--orb-2); }
      .orb-3 { background-color: var(--orb-3); }
      
      .particle-1 { background-color: rgba(16, 185, 129, 0.4); }
      .particle-2 { background-color: rgba(6, 182, 212, 0.4); }
      .particle-3 { background-color: rgba(245, 158, 11, 0.3); }
      .particle-4 { background-color: rgba(16, 185, 129, 0.4); }
      
      [data-theme="dark"] .particle-1 { background-color: rgba(168, 85, 247, 0.4); }
      [data-theme="dark"] .particle-2 { background-color: rgba(59, 130, 246, 0.4); }
      [data-theme="dark"] .particle-3 { background-color: rgba(99, 102, 241, 0.4); }
      [data-theme="dark"] .particle-4 { background-color: rgba(168, 85, 247, 0.4); }
    </style>
  </head>

  <body class="relative overflow-x-hidden transition-all duration-700">
    <!-- Theme-based animated map background -->
    <div class="fixed inset-0 z-0 pointer-events-none">
      <!-- Map grid pattern - city blocks -->
      <div id="map-grid" class="absolute inset-0" style="opacity: var(--grid-opacity);">
        <div class="absolute inset-0" style="background-image: radial-gradient(circle, currentColor 1px, transparent 1px); background-size: 24px 24px;"></div>
      </div>
      
      <!-- Road lines - subtle grid -->
      <div id="road-grid" class="absolute inset-0" style="opacity: var(--road-opacity);">
        <div class="absolute inset-0" style="background-image: linear-gradient(to right, currentColor 1px, transparent 1px), linear-gradient(to bottom, currentColor 1px, transparent 1px); background-size: 80px 80px;"></div>
      </div>
      
      <!-- Accent orbs - theme adaptive -->
      <div class="absolute inset-0 opacity-20">
        <div class="absolute top-[15%] left-[20%] w-[500px] h-[500px] rounded-full blur-3xl animate-pulse transition-all duration-700 orb-1"></div>
        <div class="absolute bottom-[10%] right-[15%] w-[400px] h-[400px] rounded-full blur-3xl animate-pulse transition-all duration-700 orb-2" style="animation-delay: 1s;"></div>
        <div class="absolute top-[50%] left-[60%] w-[450px] h-[450px] rounded-full blur-3xl animate-pulse transition-all duration-700 orb-3" style="animation-delay: 2s;"></div>
      </div>
      
      <!-- Location Pin Container -->
      <div class="absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
        <!-- Pin shadow -->
        <div class="absolute top-[42px] left-1/2 transform -translate-x-1/2 w-6 h-2 bg-black/20 rounded-full blur-sm transition-opacity duration-700" style="opacity: 0.3;"></div>
        
        <!-- Pin SVG -->
        <svg width="48" height="60" viewBox="0 0 48 60" class="drop-shadow-2xl animate-bounce" style="animation-duration: 2s;">
          <defs>
            <linearGradient id="pinGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #ef4444"/>
              <stop offset="100%" style="stop-color: #dc2626"/>
            </linearGradient>
            <linearGradient id="pinGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #f97316"/>
              <stop offset="100%" style="stop-color: #ea580c"/>
            </linearGradient>
          </defs>
          <path d="M24 0C10.745 0 0 10.745 0 24c0 18 24 36 24 36s24-18 24-36C48 10.745 37.255 0 24 0z" class="pin-path transition-all duration-700" fill="url(#pinGradientDark)"/>
          <circle cx="24" cy="24" r="10" fill="white"/>
          <circle cx="24" cy="24" r="6" fill="#1f2937" class="pin-center transition-fill duration-700"/>
        </svg>
        
        <!-- Pulse ring -->
        <div class="absolute top-[18px] left-1/2 transform -translate-x-1/2 w-12 h-12 border-2 rounded-full animate-ping opacity-40 transition-colors duration-700" style="border-color: var(--pulse-color);"></div>
      </div>
      
      <!-- Location label -->
      <div class="absolute top-[40%] left-1/2 transform -translate-x-1/2 mt-4">
        <div class="backdrop-blur-sm px-4 py-2 rounded-full border shadow-lg transition-all duration-700 theme-card-bg theme-card-border">
          <span class="font-mono text-xs tracking-wider uppercase transition-colors duration-700 theme-text-secondary">
            <span class="transition-colors duration-700 theme-accent-1">📍</span> Phoenix, AZ
          </span>
        </div>
      </div>
      
      <!-- Decorative coordinates -->
      <div class="absolute bottom-8 left-8 font-mono text-[10px] tracking-widest transition-colors duration-700 theme-text-muted">
        33.4484° N, 112.0740° W
      </div>
      
      <!-- Subtle animated particles -->
      <div class="absolute inset-0 overflow-hidden">
        <div class="particle-1 absolute top-1/4 left-1/4 w-2 h-2 rounded-full animate-bounce transition-colors duration-700" style="animation-duration: 3s;"></div>
        <div class="particle-2 absolute top-3/4 right-1/3 w-1 h-1 rounded-full animate-bounce transition-colors duration-700" style="animation-duration: 4s; animation-delay: 1s;"></div>
        <div class="particle-3 absolute top-1/2 right-1/4 w-2 h-2 rounded-full animate-bounce transition-colors duration-700" style="animation-duration: 3.5s; animation-delay: 0.5s;"></div>
        <div class="particle-4 absolute top-1/3 right-1/2 w-1 h-1 rounded-full animate-bounce transition-colors duration-700" style="animation-duration: 5s; animation-delay: 2s;"></div>
      </div>
    </div>
    
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="fixed top-4 right-4 z-50 p-3 rounded-full backdrop-blur-sm border shadow-lg transition-all duration-300 hover:scale-110 hover:shadow-xl theme-toggle-bg theme-toggle-border">
      <svg id="sun-icon" class="w-5 h-5 text-amber-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <svg id="moon-icon" class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 24.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>

    <script>
      // Theme toggle functionality
      const themeToggle = document.getElementById('theme-toggle');
      const sunIcon = document.getElementById('sun-icon');
      const moonIcon = document.getElementById('moon-icon');
      const pinPath = document.querySelector('.pin-path');
      const pinCenter = document.querySelector('.pin-center');
      
      // Check for saved theme preference or default to dark
      const savedTheme = localStorage.getItem('theme') || 'dark';
      
      function updatePinColors(isDark) {
        if (pinPath) {
          pinPath.setAttribute('fill', isDark ? 'url(#pinGradientDark)' : 'url(#pinGradientLight)');
        }
        if (pinCenter) {
          pinCenter.setAttribute('fill', isDark ? 'white' : '#1f2937');
        }
      }
      
      function updateThemeIcon(isDark) {
        if (isDark) {
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
        } else {
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
        }
      }
      
      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const isDark = theme === 'dark';
        updateThemeIcon(isDark);
        updatePinColors(isDark);
        localStorage.setItem('theme', theme);
      }
      
      // Initialize theme
      setTheme(savedTheme);
      
      // Toggle theme on button click
      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });
    </script>

    <!-- Load the nav bar template using HTMX -->
    <div
      hx-get="/templates/nav-bar.html"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></div>

    <div class="container mx-auto px-2 relative z-10">
      <h1 class="text-center text-3xl font-bold mb-4 transition-colors duration-700 theme-text-primary">Development Dashboard</h1>

      <!-- Adjusted two columns with reduced gap -->
      <div class="flex flex-col lg:flex-row items-stretch gap-2">
        <!-- Soundcloud Mixes Column with reduced padding -->
        <div class="flex-1 rounded-box bg-base-200 p-2">
          <p class="text-2xl font-bold mb-2">Soundcloud Mixes</p>
          <!-- Sub-tabs for Mixes remain as tabs -->
          <div class="tabs tabs-lifted">
            <a role="tab" class="tab tab-bordered tab-active" data-sub-tab="stream">Stream</a>
            <a role="tab" class="tab tab-bordered" data-sub-tab="favorites">Favorites</a>
          </div>
          
          <!-- Sub-tab content panels -->
          <div id="stream" class="sub-tab-panel mt-4">
            <div class="overflow-y-auto" hx-get="/api/soundcloud/stream" hx-trigger="load" hx-swap="innerHTML"></div>
          </div>
          <div id="favorites" class="sub-tab-panel hidden mt-4">
            <div class="overflow-y-auto" hx-get="/api/soundcloud/favorites" hx-trigger="load" hx-swap="innerHTML"></div>
          </div>
        </div>

        <!-- Vertical Divider using DaisyUI remains unchanged -->
        <div class="divider divider-vertical lg:divider-horizontal"></div>

        <!-- News Column with reduced padding -->
        <div class="flex-1 rounded-box bg-base-200 p-2">
          <p class="text-2xl font-bold mb-2">News</p>
          <div class="overflow-y-auto" hx-get="/api/news" hx-trigger="load" hx-swap="innerHTML"></div>
        </div>
      </div>
    </div>

    <!-- Remove primary tab switching script. Retain sub-tab switching script for Mixes only -->
    <script>
      // Sub-tabs switching within the Mixes column
      document.querySelectorAll('[data-sub-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('[data-sub-tab]').forEach(t => t.classList.remove('tab-active'));
          tab.classList.add('tab-active');
          const target = tab.getAttribute('data-sub-tab');
          document.querySelectorAll('.sub-tab-panel').forEach(panel => panel.classList.add('hidden'));
          document.getElementById(target).classList.remove('hidden');
        });
      });
    </script>
  </body>
</html>
